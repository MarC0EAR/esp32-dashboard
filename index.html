<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor ESP32: GPS y Sensores</title>
    
    <!-- Librería para el mapa (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .dashboard { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .valor { font-size: 2em; font-weight: bold; color: #d9534f; }
        #mapa { height: 400px; width: 100%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>Panel de Control ESP32</h1>

    <div class="dashboard">
        <div class="card">
            <h3>Estado de Conexión</h3>
            <p id="estado" style="color: orange;">Conectando...</p>
        </div>
        <div class="card">
            <h3>Obstáculos Detectados</h3>
            <p class="valor" id="obstaculos">0</p>
        </div>
    </div>

    <!-- Contenedor del mapa -->
    <div id="mapa"></div>

    <script>
        // 1. Configurar el mapa
        // Iniciamos en unas coordenadas base (ej. Ciudad de México) con un zoom de 15
        const mapa = L.map('mapa').setView([19.4326, -99.1332], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(mapa);
        
        // Marcador del GPS
        const marcador = L.marker([19.4326, -99.1332]).addTo(mapa);

        // 2. Conectar al WebSocket del ESP32
        // Cambia esta IP por la IP real de tu ESP32 en la red
        const gateway = `ws://10.21.16.6/ws`; 
        let websocket;

        function iniciarWebSocket() {
            console.log('Intentando abrir conexión WebSocket...');
            websocket = new WebSocket(gateway);
            
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage; 
        }

        function onOpen(event) {
            console.log('Conexión abierta');
            document.getElementById('estado').innerText = "Conectado al ESP32";
            document.getElementById('estado').style.color = "green";
        }

        function onClose(event) {
            console.log('Conexión cerrada');
            document.getElementById('estado').innerText = "Desconectado";
            document.getElementById('estado').style.color = "red";
            // Intentar reconectar después de 2 segundos
            setTimeout(iniciarWebSocket, 2000);
        }

        // 3. Recibir y procesar los datos
        function onMessage(event) {
            console.log("Datos recibidos: ", event.data);
            
            try {
                // Convertir el texto JSON a un objeto JavaScript
                const datos = JSON.parse(event.data);
                
                // Actualizar obstáculos
                if(datos.obstaculos !== undefined) {
                    document.getElementById('obstaculos').innerText = datos.obstaculos;
                }

                // Actualizar GPS en el mapa
                if(datos.lat && datos.lng) {
                    const nuevaPosicion = new L.LatLng(datos.lat, datos.lng);
                    marcador.setLatLng(nuevaPosicion);
                    mapa.panTo(nuevaPosicion); // Mover la cámara a la nueva posición
                }
                
            } catch (error) {
                console.error("Error al procesar el JSON:", error);
            }
        }

        // Arrancar la conexión cuando la página cargue
        window.addEventListener('load', iniciarWebSocket);
    </script>
</body>
</html>
